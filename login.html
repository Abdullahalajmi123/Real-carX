<!DOCTYPE html>
<html>
<head>
    <title>Login - CarX</title>
    <link rel="stylesheet" href="style.css">
    <script>
    document.getElementById("loginTitle").style.transition = "0.3s";
</script>

</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">CarX</div>

        <ul>
            <li class="center-links"><a href="index.html">Home</a></li>
            <li class="center-links"><a href="about.html">About us</a></li>
        </ul>

        <div class="right-links">
            <a href="signup.html" class="btn">Sign up</a>
            <a href="login.html" class="btn">Login</a>
        </div>

    </nav>
</header>
<section class="hero">
    <img src="Imges/car-banner.png" alt="CarX Banner">
</section>

<main class="form-container">
    <div class="form-box">
       <h2 id="loginTitle">Login to Your Account</h2>


        <form onsubmit="return validateLogin()">


            <label>Email</label>
            <input id="loginEmail" type="email" placeholder="yourname@example.com">


            <label>Password</label>
            <input id="loginPassword" type="password" placeholder="Enter password">


            <button type="submit" class="submit-btn">Login</button>

        </form>

        <p class="small-text">Don't have an account? <a href="signup.html">Sign up here</a></p>
    </div>
</main>


<footer class="footer">
    <a href="#top" style="font-size:18px;">Go back up</a>
</footer>

</body>
</html>
