<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment - CarX</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">CarX</div>

        <ul>
            <li class="center-links"><a href="index.html">Home</a></li>
            <li class="center-links"><a href="about.html">About us</a></li>
        </ul>

        <div class="right-links">
            <a href="signup.html" class="btn">Sign up</a>
            <a href="login.html" class="btn">Login</a>
        </div>

    </nav>
</header>
<section class="hero">
    <img src="Imges/car-banner.png" alt="CarX Banner">
</section>

<main class="form-container">
    <div class="form-box">
        <h2>Book an Appointment</h2>

        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Your name" required>

            <label>Email</label>
            <input type="email" placeholder="yourname@example.com" required>

            <label>Phone Number</label>
            <input type="text" placeholder="05XXXXXXXX" required>

            <label>Date</label>
            <input type="date" required>

            <label>Time</label>
            <input type="time" required>

            <label>Message (Optional)</label>
            <input type="text" placeholder="Additional notes">

            <button type="submit" class="submit-btn">Confirm Appointment</button>
        </form>
    </div>
</main>


<footer class="footer">
    <a href="#top" style="font-size:18px;">Go back up</a>
</footer>

</body>
</html>
