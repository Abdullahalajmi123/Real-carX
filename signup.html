<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - CarX</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <script>
    document.getElementById("signupTitle").style.transition = "0.3s";
</script>
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">CarX</div>

        <ul>
            <li class="center-links"><a href="index.html">Home</a></li>
            <li class="center-links"><a href="about.html">About us</a></li>
        </ul>

        <div class="right-links">
            <a href="signup.html" class="btn">Sign up</a>
            <a href="login.html" class="btn">Login</a>
        </div>

    </nav>
</header>

<section class="hero">
    <img src="Imges/car-banner.png" alt="CarX Banner">
</section>


<main class="form-container">
    <div class="form-box">
        <h2 id="signupTitle">Create Your Account</h2>


        <form onsubmit="return validateSignup()">

            <label>Full Name</label>
            <input id="signupName" type="text" placeholder="Your name">


            <label>Email</label>
            <input id="signupEmail" type="email" placeholder="yourname@example.com">


            <label>Password</label>
            <input id="signupPassword" type="password" placeholder="Enter password">


            <label>Phone Number</label>
           <input id="signupPhone" type="text" placeholder="05XXXXXXXX">


            <label>Car Model (Optional)</label>
            <input id="signupCar" type="text" placeholder="e.g. Toyota Camry">


            <button type="submit" class="submit-btn">Sign Up</button>

        </form>

        <p class="small-text">Already have an account? <a href="login.html">Login here</a></p>
    </div>
</main>


<footer class="footer">
    <a href="#top" style="font-size:18px;">Go back up</a>
</footer>

</body>
</html>
